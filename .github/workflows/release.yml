name: Release

# Push a tag "vX.Y.Z" to publish a GitHub release with the Android APK attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    env:
      # Same fixed debug key as the CI, so releases install over previous builds without losing data.
      DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Restore fixed debug keystore
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: mkdir -p ~/.android && echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Set Android version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/; s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Assemble APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="pupitre-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" --title "Pupitre ${GITHUB_REF_NAME}" --generate-notes \
            --notes "Android APK (test build, debug-signed). Install: download the .apk on your phone and open it (allow installs from this source). Updates install over the previous version without losing your scores."
