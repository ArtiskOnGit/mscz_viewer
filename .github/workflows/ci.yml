name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Lint, test, build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:pwa
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          retention-days: 7

  android:
    name: Debug APK
    needs: web
    runs-on: ubuntu-latest
    env:
      # Fixed debug signing key, so a new APK installs over the previous one without losing data.
      DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Restore the fixed signing key
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: |
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pupitre.keystore"
          echo "PUPITRE_KEYSTORE=$RUNNER_TEMP/pupitre.keystore" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256" 
      - uses: actions/upload-artifact@v7
        with:
          name: pupitre-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
